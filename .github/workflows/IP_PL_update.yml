name: IP_PL_update

on:
  schedule:
    - cron: '0 23 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download PL zone from ipdeny
        run: |
          curl -fsS --retry 3 https://www.ipdeny.com/ipblocks/data/aggregated/pl-aggregated.zone \
            -o pl.zone

      - name: Generate .rsc file
        run: |
          while IFS= read -r line; do
            line=$(echo "$line" | tr -d '\r')
            [ -z "$line" ] && continue
            echo "/ip firewall address-list add list=IP_PL address=$line comment=ipdeny_PL"
          done < pl.zone > IP_PL.rsc
          n=$(wc -l < IP_PL.rsc)
          echo "Entries: $n"
          [ "$n" -ge 100 ] || { echo "Za mało wpisów, przerywam"; exit 1; }

      - name: Commit IP_PL.rsc to main
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add IP_PL.rsc
          git diff --cached --quiet && echo "bez zmian" && exit 0
          git commit -m "update IP_PL.rsc $(date -u +%F)"
          git push origin HEAD:main
